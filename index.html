<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Deep Studio | Login</title>
    <style>
        /* 1. Arkaplanı Ayarla */
        body, html, #root {
            height: 100vh !important; margin: 0; padding: 0;
            background: #0f172a !important; /* Lacivert Arkaplan */
            display: flex !important; justify-content: center !important; align-items: center !important;
            font-family: Arial, sans-serif;
        }

        /* 2. CVAT'ın Orijinal Tasarımını Devre Dışı Bırak */
        .cvat-signing-layout-container, .cvat-signing-background, .cvat-signing-header, .cvat-signing-title, h2 {
            display: none !important;
        }

        /* 3. BİZİM KUTUMUZUN STİLİ */
        .cvat-login-form-wrapper {
            width: 420px !important;
            background: #ffffff !important;
            padding: 40px !important;
            border-radius: 16px !important;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3) !important;
            display: block !important;
            z-index: 9999 !important;
            position: relative !important;
        }

        /* 4. Deep Studio Başlığı */
        .deep-studio-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #2E0854;
            margin-bottom: 30px;
        }

        /* 5. İnputlar ve Buton */
        .ant-input { border-radius: 8px !important; padding: 10px !important; }
        .cvat-credentials-action-button {
            background: #2E0854 !important;
            border: none !important;
            height: 48px !important;
            border-radius: 8px !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // FORMUN GÖRÜNMESİNİ SAĞLAYAN SİHİRLİ DOKUNUŞ
        function fixDesign() {
            const wrapper = document.querySelector('.cvat-login-form-wrapper');
            if (wrapper && !document.querySelector('.deep-studio-title')) {
                // Başlığı Ekle
                const title = document.createElement('div');
                title.className = 'deep-studio-title';
                title.innerText = 'Deep Studio';
                wrapper.prepend(title);

                // Kapsayıcıyı Görünür Yap
                wrapper.style.display = 'block';
                wrapper.style.opacity = '1';
                wrapper.parentElement.style.display = 'block';
            }
        }
        // Sayfa yüklendikçe kontrol et
        setInterval(fixDesign, 500);
    </script>

    <script defer="defer" src="/assets/cvat-ui.6d6ba43fd344a3a2695f.min.js"></script>
    <script defer="defer" src="/assets/plugin_0.833cda7d57627f38c0d9.min.js"></script>
</body>
</html>
