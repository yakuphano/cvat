<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><title>Deep Studio</title>
    <style>
        /* Sadece yükleme ekranı kararmasın diye temel bir renk */
        body { background: #0f172a !important; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="layout-grid"></div>

    <script>
        // BU BÖLÜM: Formu bulup saniyeler içinde senin istediğin hale getiren robot
        const observer = new MutationObserver(() => {
            const form = document.querySelector('.cvat-login-form-wrapper');
            if (form && !form.getAttribute('data-styled')) {
                // 1. Ana Paneli İkiye Böl ve Resimdeki Tasarımı Giydir
                form.style.cssText = `
                    display: flex !important; flex-direction: row !important;
                    width: 850px !important; height: 500px !important;
                    position: fixed !important; top: 50% !important; left: 50% !important;
                    transform: translate(-50%, -50%) !important;
                    background: white !important; border-radius: 20px !important;
                    box-shadow: 0 30px 60px rgba(0,0,0,0.3) !important; z-index: 999999 !important;
                    overflow: hidden !important; padding: 0 !important;
                `;

                // 2. Sol tarafa Mor Paneli ve "Deep Studio" Yazısını Ekle
                if (!document.getElementById('side-panel')) {
                    const side = document.createElement('div');
                    side.id = 'side-panel';
                    side.style.cssText = `
                        width: 45%; background: #2E0854; color: white;
                        display: flex; flex-direction: column; justify-content: center;
                        padding: 40px; font-family: sans-serif;
                    `;
                    side.innerHTML = '<h1 style="font-size:32px;margin:0">Deep Studio</h1><p style="font-size:18px;opacity:0.8;margin-top:20px">Welcome back! Sign in to continue.</p>';
                    form.prepend(side);
                }

                // 3. Mail ve Şifre Kutularını "Gerçek Kutu" Yap
                const inputs = form.querySelectorAll('.ant-input, .ant-input-affix-wrapper');
                inputs.forEach(input => {
                    input.style.cssText = `
                        border: 2px solid #cbd5e1 !important; border-radius: 10px !important;
                        height: 50px !important; margin-bottom: 15px !important;
                        background: white !important; display: flex !important;
                    `;
                });

                // 4. Giriş Butonunu Mor Yap
                const btn = form.querySelector('.cvat-credentials-action-button');
                if(btn) btn.style.cssText = "background:#2E0854!important;color:white!important;height:50px!important;border-radius:10px!important;width:100%!important;border:none!important;font-weight:bold!important;";

                form.setAttribute('data-styled', 'true');
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
    </script>

    <script defer="defer" src="/assets/cvat-ui.6d6ba43fd344a3a2695f.min.js"></script>
    <script defer="defer" src="/assets/plugin_0.833cda7d57627f38c0d9.min.js"></script>
</body>
</html>
